services:
  - type: web
    name: mlb-pitch-intelligence
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: render
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mlb-pitch-intelligence-db
          property: connectionString
      - key: PITCH_DATA_PATH
        value: data/sample_statcast.csv
      - key: STATCAST_SEED_PATH
        value: data/production_statcast_2026.csv.gz
      - key: RUN_MIGRATIONS
        value: "1"
      - key: SEED_DATABASE
        value: "1"
      - key: SYNC_RECENT_ON_STARTUP
        value: "1"
      - key: SYNC_RECENT_LOOKBACK_DAYS
        value: "4"
      - key: GUNICORN_WORKERS
        value: "1"

databases:
  - name: mlb-pitch-intelligence-db
    plan: free
    databaseName: mlb_pitch_intelligence
    user: mlb_pitch_intelligence
    postgresMajorVersion: "17"
    ipAllowList: []
