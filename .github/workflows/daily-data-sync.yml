name: Daily Statcast Sync

on:
  schedule:
    - cron: "0 15 15-31 3 *"
    - cron: "0 15 * 4-10 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-statcast-sync
  cancel-in-progress: false

jobs:
  trigger-render-deploy:
    name: Trigger Render data refresh
    runs-on: ubuntu-latest
    steps:
      - name: Verify deploy hook is configured
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Add RENDER_DEPLOY_HOOK_URL as a GitHub Actions repository secret."
            exit 1
          fi
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"
