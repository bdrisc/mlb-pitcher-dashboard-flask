name: Controlled Snapshot Release (manual checklist)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-checklist:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the protected release process
        run: |
          echo "Live data refresh is intentionally disabled."
          echo "Review docs/controlled-snapshot-release.md in the repository."
          echo "Prepare and validate a staging snapshot before requesting publication."
          echo "This workflow does not deploy, connect to databases, or change data."
