name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mlb_pitch_intelligence_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mlb_pitch_intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mlb_pitch_intelligence_test
      PITCH_DATA_PATH: data/sample_statcast.csv
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Run test suite
        run: python -m pytest
      - name: Apply PostgreSQL migrations
        run: flask --app wsgi db upgrade
      - name: Ingest the smoke-test dataset
        run: flask --app wsgi statcast ingest data/sample_statcast.csv
      - name: Verify the PostgreSQL-backed profile
        run: >-
          python -c "from wsgi import app; client = app.test_client();
          assert client.get('/api/v1/pitchers/999001/profile?season=2026').status_code == 200;
          assert client.get('/api/v1/pitchers/999001/charts?season=2026').status_code == 200"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag mlb-pitch-intelligence:ci .
