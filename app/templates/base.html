<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}MLB Pitcher Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    {% block head %}{% endblock %}
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <header class="site-header">
      <a class="brand" href="{{ url_for('main.index') }}" aria-label="MLB Pitcher Dashboard home">
        <span class="brand-mark" aria-hidden="true">PD</span>
        <span>
          <strong>MLB Pitcher Dashboard</strong>
          <small>Statistical evaluation platform</small>
        </span>
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="{{ url_for('main.index') }}">Home</a>
        <a href="{{ url_for('main.savant_card') }}">Pitcher Report</a>
        <a href="{{ url_for('api.pitchers') }}">API</a>
      </nav>
    </header>

    {% block content %}{% endblock %}

    <footer class="site-footer">
      <span>MLB Pitcher Dashboard</span>
      <span>Flask · PostgreSQL · SQLAlchemy</span>
    </footer>
    {% block scripts %}{% endblock %}
  </body>
</html>
